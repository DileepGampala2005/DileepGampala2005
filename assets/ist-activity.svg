<svg width="340" height="200" viewBox="0 0 340 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Commit activity in Indian Standard Time</title>
  <desc id="desc">A GitHub profile card showing that commit activity is presented in Indian Standard Time, UTC plus 5 hours and 30 minutes.</desc>
  <rect width="340" height="200" rx="12" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="339" height="199" rx="11.5" stroke="#30363D"/>
  <text x="24" y="38" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">COMMIT ACTIVITY</text>
  <text x="24" y="80" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Indian Standard Time</text>
  <text x="24" y="112" fill="#2F80ED" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">IST (UTC+5:30)</text>
  <rect x="24" y="138" width="86" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
  <text x="42" y="158" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">India</text>
  <rect x="120" y="138" width="91" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
  <text x="139" y="158" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Kolkata</text>
  <rect x="221" y="138" width="95" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
  <text x="239" y="158" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">No UTC label</text>
</svg>
